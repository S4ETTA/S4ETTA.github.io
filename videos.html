<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SAETTA | VIDEOS</title>
    <link rel="stylesheet" href="style.css?v=1.5.0">
    <style>
        /* Backup aspect ratio lock if JS fails to inline styles */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            background: #000;
            border-bottom: 1px solid var(--ink-color);
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="saetta-nav"></div>
    <script src="nav.js?v=1.5.0"></script>

    <main class="container">
        <h2>// VISUAL ARCHIVE</h2>
        <div id="video-grid" class="grid-3"></div>
    </main>

    <script src="db.js?v=1.5.0"></script>
    <script src="loader.js?v=1.5.0"></script>

</body>
</html>
