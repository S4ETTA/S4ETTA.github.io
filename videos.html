<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SAETTA | VIDEOS</title>
    <link rel="stylesheet" href="style.css?v=1.0.1">
    <style>
        /* Specific fix for Video aspect ratios in the tight grid */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Forces 16:9 Aspect Ratio */
            background: #000;
            border-bottom: 1px solid var(--ink-color);
        }
        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }
    </style>
</head>
