<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAETTA | TOOLS</title>
    <link rel="stylesheet" href="style.css?v=1.60">
</head>

<body>
    <div id="saetta-nav"></div>
    <script src="nav.js?v=1.60"></script>

    <main class="container">
        <h2>TOOLS</h2>
        <div id="tool-grid" class="grid-3"></div>

        <h2 style="margin-top: 60px;">EXTERNAL ASSETS (OSINT)</h2>
        <div class="osint-cluster-container">

            <!-- Systems Cluster -->
            <div class="osint-category">
                <div class="osint-cat-header">SYSTEMS</div>
                <div class="osint-tool-grid">
                    <a href="https://www.flightradar24.com/" target="_blank" class="osint-tool-btn"
                        data-tooltip="Flightradar24">
                        <span class="osint-icon">✈</span>
                    </a>
                    <a href="https://globe.adsbexchange.com/" target="_blank" class="osint-tool-btn"
                        data-tooltip="ADSBexchange">
                        <span class="osint-icon">📡</span>
                    </a>
                    <a href="https://www.marinetraffic.com/" target="_blank" class="osint-tool-btn"
                        data-tooltip="MarineTraffic (AIS)">
                        <span class="osint-icon">⚓</span>
                    </a>
                </div>
            </div>

            <!-- Geospatial Cluster -->
            <div class="osint-category">
                <div class="osint-cat-header">GEOSPATIAL</div>
                <div class="osint-tool-grid">
                    <a href="https://earth.google.com/" target="_blank" class="osint-tool-btn"
                        data-tooltip="Google Earth">
                        <span class="osint-icon">🌍</span>
                    </a>
                    <a href="https://browser.dataspace.copernicus.eu/" target="_blank" class="osint-tool-btn"
                        data-tooltip="Copernicus">
                        <span class="osint-icon">🛰</span>
                    </a>
                    <a href="https://firms.modaps.eosdis.nasa.gov/" target="_blank" class="osint-tool-btn"
                        data-tooltip="FIRMS">
                        <span class="osint-icon">🔥</span>
                    </a>
                    <a href="https://earthexplorer.usgs.gov/" target="_blank" class="osint-tool-btn"
                        data-tooltip="USGS EarthExplorer">
                        <span class="osint-icon">⛰</span>
                    </a>
                    <a href="https://dwtkns.com/srtm30m/" target="_blank" class="osint-tool-btn"
                        data-tooltip="SRTM Tile Grabber">
                        <span class="osint-icon">🗺</span>
                    </a>
                </div>
            </div>

            <!-- Signal Cluster -->
            <div class="osint-category">
                <div class="osint-cat-header">SIGNAL</div>
                <div class="osint-tool-grid">
                    <a href="http://websdr.org/" target="_blank" class="osint-tool-btn" data-tooltip="WebSDR">
                        <span class="osint-icon">📻</span>
                    </a>
                    <a href="https://www.radioreference.com/" target="_blank" class="osint-tool-btn"
                        data-tooltip="RadioReference">
                        <span class="osint-icon">📶</span>
                    </a>
                    <a href="https://wigle.net/" target="_blank" class="osint-tool-btn" data-tooltip="WiGLE">
                        <span class="osint-icon">🌐</span>
                    </a>
                </div>
            </div>

            <!-- Personnel Cluster -->
            <div class="osint-category">
                <div class="osint-cat-header">PERSONNEL</div>
                <div class="osint-tool-grid">
                    <a href="https://www.maltego.com/" target="_blank" class="osint-tool-btn" data-tooltip="Maltego">
                        <span class="osint-icon">🕸</span>
                    </a>
                    <a href="https://osint.industries/" target="_blank" class="osint-tool-btn"
                        data-tooltip="OSINT Industries">
                        <span class="osint-icon">👁</span>
                    </a>
                    <a href="https://opencorporates.com/" target="_blank" class="osint-tool-btn"
                        data-tooltip="OpenCorporates">
                        <span class="osint-icon">🏛</span>
                    </a>
                </div>
            </div>

        </div>
    </main>

    <script src="db.js?v=1.60"></script>
    <script src="loader.js?v=1.60"></script>
</body>

</html>
